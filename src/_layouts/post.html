<!DOCTYPE html>
<html lang="{{ lang }}" dir="ltr">
	{% include 'head.html' %}
	<body>
		<div class='grid-container'>
			{% set basicpage = true %}
			{% include 'navbar.html' %}
			<div class="left-pane vertical-centre">
				<!--{% include 'list-index-pages.html' %}-->
			</div>
			<div class="content">
				<h1>{{ title }}</h1>
				{{ content | main | safe }}
				<p class="date">✎ {{ page.date | formatDate }}</p>
			</div>
			<!--
			<div class="note2">
				<p>
					{{ content | sidenote | safe }}
				<p>
			</div>
			-->
		</div>
		{% include 'footer.html' %}
		<script>
			// On narrow screens the navbar stacks above the post; jump past it.
			// Skip if returning with a restored scroll position or a #hash link.
			(function () {
				var content = document.querySelector('.content');
				if (!content || location.hash || window.scrollY > 0) return;
				if (content.getBoundingClientRect().top > window.innerHeight * 0.4) {
					content.scrollIntoView({ block: 'start' });
				}
			})();
		</script>
	</body>

</html>
